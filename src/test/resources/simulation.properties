# =====================================================================
# HB4J 3-D Incompressible Navier-Stokes Spectral Simulation Configuration
# =====================================================================

# --- Simulation Marching & Time Parameters ---
# Whether to initialize a new flow (true) or attempt to load a checkpoint restart (false).
# When false, EITHER set simulation.oldflow.file below OR pass the checkpoint path as
# the first positional arg to main — silently loading a filename in cwd is disabled.
simulation.newflow = false

# Path of the checkpoint to restart FROM (only used when newflow=false). Leave commented
# out for a fresh run. Saved files at the end of a run are named
#   checkpoint_<simID>_<yyyyMMdd-HHmmss>.dat
# where simID is the SHA-256 short-hash of THIS properties file — so restart-from-self
# uses whatever this run's file name ended up being.
#
# Format is chosen by the file extension:
#   *.csv       → CSV loader. Rows of "i j k  u v w  wx wy wz" with
#                 1-based indices in [1, N], whitespace OR comma
#                 separated. Blank/# lines are ignored. Exactly N³
#                 rows required, N inferred from max index, must match
#                 n1=n2=n3. Vorticity columns (wx, wy, wz) are compared
#                 against curl(u) computed after loading, and the
#                 max-abs / RMS mismatch is logged.
#   anything else → native binary format written by saveCheckpoint().
simulation.oldflow.file = PATH_TO_RESTART_CSV_FILE_GOES_HERE/restart.csv
# Marching scheme order: 1, 2, or 3 (corresponds to stiffly stable schemes)
simulation.norder = 2

# Total number of time steps to run
simulation.nhalt = 200

# Time step size
simulation.dt = 0.0001

# Initial/start time (typically 0.0)
simulation.ttime = 0.0

# Whether to save a final checkpoint file 'checkpoint.dat' at the end of the run
simulation.storeFile = true

# --- Statistics & Logging Intervals ---
# Number of steps between statistics logging (prints current time and isotropy indices)
simulation.nshort = 10

# Number of steps between full spectrum evaluations (dissipation, energy spectra)
simulation.nspec = 50

# --- De-aliasing & Viscosity Parameters ---
# Spectral cutoff radius for de-aliasing filter (typically 0.85; use 1.0 for no cutoff)
simulation.cutoff = 0.85

# Kinematic viscosity of the fluid
simulation.rnu = 0.0001

# --- Flow Initialization Parameters ---
# Type of initial flow to generate:
#   1 = Random spectral noise (ranflow)
#   2 = Lattice of Burgers-like vortex cells (vortex_flow)
#   3 = Single Burgers-like vortex tube aligned with the z-axis, centred
#       on the box middle. Reuses vAlpha, vBeta, vortexStrength (first
#       array element of each); vCell / vStep / vRatio are IGNORED.
#   4 = Two parallel Burgers-like vortex tubes, both aligned with the
#       z-axis, offset along x by ±vortexTubeSeparation/2 from the box
#       centre. Requires vAlpha, vBeta, vortexStrength to be
#       comma-separated arrays with 2 entries — one per tube. The sign of
#       vortexStrength[i] sets tube i's rotation sense (Γ, -Γ =
#       counter-rotating dipole; Γ, Γ = co-rotating pair). vCell / vStep /
#       vRatio are IGNORED.
simulation.initialFlow = 3

# Peak wavenumber for random energy spectrum initialization
simulation.facp = 2.5

# Whether to scale the initial random spectrum to reference energy
# Rescales the freshly-initialized flow so the initial physical energy
# equals simulation.scaleEnergy (defaults to 1.0 in code). Required with
# our FFT normalization convention — without this, initial energy is O(1/N²)
simulation.scaleflow = false
simulation.scaleEnergy = 1.0

# Constant parameters for initial energy spectrum shape:
simulation.c1 = 1.0
simulation.c2 = -1.0
simulation.c3 = -1.0
simulation.c4 = 1.0

# --- Vortex-specific Initial Parameters (initialFlow = 2, 3, or 4) ---
# The three physical parameters below (vAlpha, vBeta, vortexStrength)
# are accepted as comma-separated arrays. Modes 2 and 3 use only the
# FIRST array element; mode 4 requires arrays of length 2, one entry
# per tube. Bare scalars like "0.05" still parse as a length-1 array.

# Each vortex cell in the initial field is a Burgers-like vortex —
# a superposition of a radial sink, an azimuthal Lamb-Oseen-like tail,
# and an axial Gaussian core:
#     u_r = -(vAlpha/2) · r
#     u_θ =  (vortexStrength / (2π·r)) · (1 - exp(vAlpha·r² / (4·rnu)))
#     u_z =  vAlpha · z_ax · exp(-vBeta · z_ax²)
# The box is tiled with cubic cells of half-width vCell (physical grid
# points); successive tilings coarsen by vStep until the cell reaches
# vRatio · n1, then all layers are summed. The axis of each cell
# rotates x → y → z around the box for isotropy. After all cells are
# laid down, the field is FFT'd to spectral space, projected onto the
# divergence-free subspace, and its DC mode zeroed — same
# post-processing as ranflow.

# vAlpha — strength of the radial sink and axial core (dimensionless
#          on the 2π-periodic box). Larger vAlpha → stronger inflow and
#          more energetic core; also enters the Reynolds-like number
#          vAlpha/(4·rnu) that sets the azimuthal saturation radius.
simulation.vAlpha = -0.1, -0.1 

# vBeta — inverse-width of the axial Gaussian in u_z. Larger vBeta →
#         thinner, more peaked axial jet at the cell center.
simulation.vBeta = 0.5, 0.5

# vortexStrength — Γ, the circulation of the azimuthal component.
#                  Sets the far-field u_θ ~ Γ/(2π·r) around each core.
#                  Sign controls rotation sense; only mode 4 uses this.
simulation.vortexStrength = 0.075, -0.075

# vortexTubeSeparation — used ONLY by initialFlow=4. Distance (in the
#                        same physical units as the 2π-periodic box)
#                        between the two parallel tubes. They sit at
#                        (π ± vortexTubeSeparation/2, π), both along z.
simulation.vortexTubeSeparation = 1.0

# vCell — starting cell half-width in grid points. Cells tile the box
#         at step 2·vCell − 1, so the physical cell width is
#         (2·vCell − 1) · (2π/n2). With n=64 and vCell=6, each cell
#         spans ~11 grid points ≈ π/3 in physical units.
simulation.vCell = 4

# vStep — increment applied to vCell after each tiling pass. The
#         initializer loops WHILE (vCell < vRatio·n1), each pass
#         additively stacks a coarser lattice of vortices on top of
#         the previous ones. Larger vStep → fewer stacked layers.
simulation.vStep = 4

# vRatio — largest cell half-width as a fraction of n1. Terminates the
#          coarsening loop when vCell reaches vRatio·n1. Typical
#          value 0.2 caps cells at ~20% of the box.
simulation.vRatio = 0.2
