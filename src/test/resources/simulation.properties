# =====================================================================
# HB4J 3-D Incompressible Navier-Stokes Spectral Simulation Configuration
# =====================================================================

# --- Simulation Marching & Time Parameters ---
# Whether to initialize a new flow (true) or attempt to load a checkpoint restart (false)
simulation.newflow = true

# Marching scheme order: 1, 2, or 3 (corresponds to stiffly stable schemes)
simulation.norder = 2

# Total number of time steps to run
simulation.nhalt = 1000

# Time step size
simulation.dt = 0.0001

# Initial/start time (typically 0.0)
simulation.ttime = 0.0

# Whether to save a final checkpoint file 'checkpoint.dat' at the end of the run
simulation.storeFile = true

# --- Statistics & Logging Intervals ---
# Number of steps between statistics logging (prints current time and isotropy indices)
simulation.nshort = 50

# Number of steps between full spectrum evaluations (dissipation, energy spectra)
simulation.nspec = 500

# --- De-aliasing & Viscosity Parameters ---
# Spectral cutoff radius for de-aliasing filter (typically 0.85; use 1.0 for no cutoff)
simulation.cutoff = 0.85

# Kinematic viscosity of the fluid
simulation.rnu = 0.0001

# --- Flow Initialization Parameters ---
# Type of initial flow to generate: 1 = Random spectral noise (ranflow), 2 = Vortex cells
simulation.initialFlow = 1

# Peak wavenumber for random energy spectrum initialization
simulation.facp = 2.5

# Whether to scale the initial random spectrum to reference energy
simulation.scaleflow = false

# Constant parameters for initial energy spectrum shape:
simulation.c1 = 1.0
simulation.c2 = -1.0
simulation.c3 = -1.0
simulation.c4 = 1.0

# --- Vortex-specific Initial Parameters (Only used if initialFlow = 2) ---
simulation.vAlpha = 0.05
simulation.vBeta = 0.5
simulation.vortexStrength = 0.015
simulation.vCell = 6
simulation.vStep = 6
simulation.vRatio = 0.2
